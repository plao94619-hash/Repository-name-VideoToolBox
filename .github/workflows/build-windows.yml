name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.4.2"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run unit tests
        shell: pwsh
        env:
          PYTHONPATH: src
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-previews
        run: python -m unittest discover -s tests -v

      - name: Check high-DPI UI layouts
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python -m unittest discover -s tests -p test_ui.py -v

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: UI-Previews-Windows
          path: ${{ runner.temp }}/ui-previews/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Download FFmpeg and FFprobe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "User-Agent" = "Universal-Media-Toolbox-CI"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq "ffmpeg-master-latest-win64-gpl.zip" } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -like "*win64-gpl.zip" -and $_.name -notlike "*shared*" } | Select-Object -First 1
          }
          if (-not $asset) {
            throw "The expected FFmpeg win64 GPL static archive was not found."
          }

          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive -Headers $headers
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $ffmpeg = Get-ChildItem $extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "FFmpeg archive did not contain ffmpeg.exe and ffprobe.exe."
          }
          Copy-Item $ffmpeg.FullName "tools\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "tools\ffprobe.exe"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.GPLv3" -OutFile "tools\FFmpeg-GPL-3.0.txt"
          & "tools\ffmpeg.exe" -version
          & "tools\ffprobe.exe" -version

      - name: Run FFmpeg integration tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Generate application icon
        shell: pwsh
        run: python scripts\make_icon.py

      - name: Build application
        shell: pwsh
        run: pyinstaller build.spec --noconfirm --clean

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $exe = "dist\万能音视频工具箱\万能音视频工具箱.exe"
          if (-not (Test-Path $exe)) {
            throw "Packaged executable was not created."
          }
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged application self-test failed with exit code $($process.ExitCode)."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler is unavailable."
          }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\videotoolbox.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }

          Compress-Archive -Path "dist\万能音视频工具箱\*" -DestinationPath "release\Universal-Media-Toolbox-Portable-$($env:APP_VERSION).zip" -CompressionLevel Optimal -Force

          $installer = "release\Universal-Media-Toolbox-Setup-$($env:APP_VERSION).exe"
          if (-not (Test-Path $installer)) {
            throw "Installer output was not created."
          }

          Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content -Path "release\SHA256SUMS.txt" -Encoding ascii

          Get-ChildItem release -File | Format-Table Name, Length

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Media-Toolbox-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$($env:APP_VERSION)"
          }
          if ($tag -ne "v$($env:APP_VERSION)") {
            throw "Release tag $tag does not match application version $env:APP_VERSION."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping its published assets."
            exit 0
          }
          gh release create $tag release/* --target "$env:GITHUB_SHA" --generate-notes --title "万能音视频工具箱 $tag"
